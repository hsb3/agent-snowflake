[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repl-client-graph"
version = "0.1.0"
description = "StateGraph-based REPL client for LangGraph Dev Server"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "langgraph>=1.0.7",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
    "ty>=0.0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/repl_client_graph"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
