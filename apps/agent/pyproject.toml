[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-snowflake"
version = "0.1.0"
description = "LangGraph SQL agent with database guardrails"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.3",
    "duckdb-engine>=0.17.0",
    "langchain>=1.2.7",
    "langchain-anthropic>=1.3.1",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.2.0",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.7",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "snowflake-connector-python>=4.2.0",
    "snowflake-sqlalchemy>=1.8.2",
    "sqlalchemy>=2.0.46",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.12",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
    "ty>=0.0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_snowflake"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests (require running server)",
]
