[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-snowflake"
version = "0.1.0"
description = "LangGraph SQL agent with database guardrails"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.13",
    "langchain-anthropic>=1.4.6",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.2.1",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.3",
    "python-dotenv>=1.2.2",
    "snowflake-connector-python>=4.4.0",
    "snowflake-sqlalchemy>=1.9.0",
    "sqlalchemy>=2.0.48",
    "sqlparse>=0.5.5",
]


[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.19",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
    "ty>=0.0.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests (require running server)",
]
