[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-snowflake"
version = "0.1.0"
description = "agent that connects to databases and uses various middlewares"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.3",
    "duckdb-engine>=0.17.0",
    "fakesnow>=0.11.1",
    "grandalf>=0.8",
    "langchain>=1.2.7",
    "langchain-anthropic>=1.3.1",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.2.0",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.7",
    "pydantic-settings>=2.12.0",
    "pyppeteer>=0.0.25",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.1",
    "snowflake-connector-python>=4.2.0",
    "snowflake-sqlalchemy>=1.8.2",
    "sqlalchemy>=2.0.46",
    "textual>=7.3.0",
]

[project.scripts]
repl-tui = "repl_client.tui.__main__:main"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.12",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
    "ty>=0.0.13",
]
repl = [
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_snowflake", "src/repl_client"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ty]
# Type checking configuration for ty
# Run with: ty check src/

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests (require running server)",
]
