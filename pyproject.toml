[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-snowflake"
version = "0.1.0"
description = "LangGraph agent for Snowflake database interactions"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Henry Burden", email = "hsb3@example.com" }
]
keywords = ["langchain", "langgraph", "snowflake", "agent", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fakesnow>=0.11.1",
    "langchain>=1.2.7",
    "langchain-anthropic>=1.3.1",
    "langchain-google-genai>=4.2.0",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.7",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "snowflake-connector-python>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.4.12",
    "ruff>=0.14.14",
    "ty>=0.0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_snowflake"]

[tool.uv]
dev-dependencies = [
    "langgraph-cli[inmem]>=0.4.12",
    "ruff>=0.14.14",
    "ty>=0.0.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ty]
# Type checking configuration for ty
# Run with: ty check src/

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
