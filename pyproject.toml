[project]
name = "agent-snowflake-monorepo"
version = "0.1.0"
description = "Monorepo containing LangGraph SQL agent and REPL clients"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/*"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.12",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
    "ty>=0.0.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = [".", "apps/agent/src", "apps/repl-client/src", "apps/repl-client-graph/src"]
testpaths = ["apps/agent/tests", "apps/repl-client/tests", "apps/repl-client-graph/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests (require running server)",
]
