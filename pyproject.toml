[project]
name = "agent-snowflake-monorepo"
version = "0.1.0"
description = "Monorepo containing LangGraph SQL agent and REPL clients"
requires-python = ">=3.12"

# NOTE: No workspace configuration - each app has its own .venv
# Run `make install` from within each app directory

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4"]
ignore = ["E501"]

# NOTE: Each app has its own pytest config in its pyproject.toml
# Run tests from within each app directory: cd apps/<app> && make test
